<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Materi 6 - Transition and Animation</title>
    <link rel="stylesheet" href="../css/output.css" />
  </head>
  <body>
    <h1>MATERI 6 - TRANSITION AND ANIMATION</h1>

    <h2>1. TRANSITION AND DURATION</h2>
    <button
      class="bg-blue-500 hover:bg-blue-700 text-white px-4 transition duration-300"
    >
      Hover Me
    </button>

    <h2>2. EASING FUNCTION</h2>
    <button
      class="bg-blue-500 hover:bg-blue-700 hover:text-amber-400 text-white px-4 transition duration-300 ease-in-out"
    >
      Hover Me
    </button>

    <h2>3. ANIMATE</h2>
    <div class="bg-black w-20 h-20 m-10 animate-bounce"></div>
  </body>
</html>
