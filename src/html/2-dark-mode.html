<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Materi 2 - Dark Mode</title>
    <link rel="stylesheet" href="../css/output.css" />
  </head>
  <body class="dark:bg-black dark:text-white">
    <h1>MATERI 2 - DARK MODE</h1>
    <button
      class="bg-blue-500 text-white border-2 border-black px-6 rounded-full hover:bg-blue-900 active:bg-red-400"
      id="toggleTheme"
    >
      Toggle Theme
    </button>

    <script>
      const button = document.getElementById("toggleTheme");

      button.addEventListener("click", () => {
        document.documentElement.classList.toggle("dark");
      });
    </script>
  </body>
</html>
